
name: Build MotionX IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "Checking repository files"
          ls -la
          find . -maxdepth 4 -name "*.swift"
          test -f project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build MotionX
        run: |
          xcodebuild \
            -project MotionX.xcodeproj \
            -scheme MotionX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MotionX.app Payload/
          zip -r MotionX-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotionX-unsigned-IPA
          path: MotionX-unsigned.ipa
