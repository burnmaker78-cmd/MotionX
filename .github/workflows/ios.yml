
name: Build MotionX IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(find /Applications \
            -maxdepth 1 -name 'Xcode*.app' | sort | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build MotionX
        run: |
          xcodebuild \
            -project MotionX.xcodeproj \
            -scheme MotionX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/MotionX.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r MotionX-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotionX-unsigned-IPA
          path: MotionX-unsigned.ipa
