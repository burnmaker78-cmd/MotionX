
name: Build MotionX IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Xcode project
        id: project
        run: |
          PROJECT=$(find . -maxdepth 5 -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "No Xcode project found."
            echo "The MotionX Xcode project must be added first."
            exit 1
          fi
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Build unsigned IPA
        run: |
          PROJECT="${{ steps.project.outputs.path }}"
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" |
            ruby -rjson -e 'puts JSON.parse(STDIN.read)["project"]["schemes"][0]')
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r MotionX-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotionX-unsigned-IPA
          path: MotionX-unsigned.ipa
